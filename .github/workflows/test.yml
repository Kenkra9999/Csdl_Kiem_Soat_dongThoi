name: PostgreSQL integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # These credentials exist only inside the disposable CI container.
      PGPASSWORD: ci-postgres
      DATABASE_URL: postgresql://auction19_owner:ci-owner@localhost:5432/auction19_demo
      APP_DATABASE_URL: postgresql://auction19_app:ci-app@localhost:5432/auction19_demo
      TEST_DATABASE_URL: postgresql://auction19_owner:ci-owner@localhost:5432/auction19_test
      BENCH_DATABASE_URL: postgresql://auction19_owner:ci-owner@localhost:5432/auction19_bench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Create project roles and isolated databases
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE auction19_owner LOGIN PASSWORD 'ci-owner';"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE auction19_app LOGIN PASSWORD 'ci-app';"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE auction19_demo OWNER auction19_owner;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE auction19_test OWNER auction19_owner;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE auction19_bench OWNER auction19_owner;"
      - run: python -m auction_lab setup
      - run: python -m auction_lab test
      - run: node --test tests/frontend.test.cjs
      - run: python -m auction_lab verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-test-results
          path: output/test-results.json
