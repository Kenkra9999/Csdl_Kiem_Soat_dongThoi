    <radialGradient id="gold" cx=".32" cy=".22" r=".85"><stop offset="0" stop-color="#f4dfaa"/><stop offset=".45" stop-color="#d4ad61"/><stop offset=".8" stop-color="#b68b46"/><stop offset="1" stop-color="#8e6938"/></radialGradient>
