<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Bộ tiền xu sưu tầm màu vàng đồng</title>
  <desc id="desc">Minh họa những đồng xu với hoa văn lá nguyệt quế, cạnh khía và hộp trưng bày trên nền màu kem.</desc>
  <defs>
