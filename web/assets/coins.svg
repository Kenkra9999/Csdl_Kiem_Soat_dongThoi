      <g fill="#9b7338" opacity=".8"><path d="M-24 58c20-5 39-3 50 3l-4 9h-49zM-20 51c-16-11-23-28-21-44l7-22 13-13 8-27 22-4 18 15 1 22 16 17-12 9-4 15-13 5v14l17 12-4 9z"/><path d="M-6-68c26-9 42 11 39 31-8-7-15-12-28-10-10-2-16-8-11-21"/></g>
